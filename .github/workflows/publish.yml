name: Publish to npm

on:
  push:
    branches: [main]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Trusted publishing (OIDC): npm authenticates the runner from this token,
    # not a secret. `id-token: write` is what mints it. Configured against this
    # package on npmjs.com as: org `signalwire`, repo `signalwire-address-widget`,
    # workflow `publish.yml`. No NPM_TOKEN — classic tokens were revoked in Dec
    # 2025 and granular ones kept minting with an empty package scope.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Node 24 for npm >= 11.5.1, which is the floor for OIDC publishing.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # setup-node's bundled npm can trail the OIDC floor; pin it up explicitly
      # so a runner-image bump can't drop us below 11.5.1 silently.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Detect version bump
        id: version
        run: |
          set -euo pipefail
          current=$(node -p "require('./package.json').version")
          previous=$(git show HEAD~1:package.json 2>/dev/null | node -p "try { JSON.parse(require('fs').readFileSync(0,'utf8')).version } catch (e) { '' }" || echo "")
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ -n "$previous" ] && [ "$current" != "$previous" ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "Version bumped: $previous -> $current"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "Version unchanged ($current) — will publish dev release"
          fi

      # No NODE_AUTH_TOKEN on any publish below: OIDC handles auth, and
      # provenance is generated automatically for a public repo under trusted
      # publishing, so the --provenance flag is likewise unnecessary.
      - name: Publish latest
        if: steps.version.outputs.bumped == 'true'
        run: npm publish --tag latest --access public

      - name: Set dev version
        if: steps.version.outputs.bumped != 'true'
        run: |
          short_sha=$(git rev-parse --short HEAD)
          stamp=$(date -u +%Y%m%d%H%M%S)
          npm version "${{ steps.version.outputs.current }}-dev.${stamp}.${short_sha}" --no-git-tag-version

      - name: Publish dev
        if: steps.version.outputs.bumped != 'true'
        run: npm publish --tag dev --access public
